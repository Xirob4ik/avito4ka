name: build

on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64            # newest installed Visual Studio
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: build\Tests\ClipperTests_artefacts\Release\ClipperTests.exe
      - name: VST3 host check
        run: build\Tests\ClipperHostCheck_artefacts\Release\ClipperHostCheck.exe build\Clipline_artefacts\Release\VST3\Clipline.vst3
      - name: Install with the installer and check the installed plugin
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\Installer\Windows\Release -Filter *-Setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          build\Tests\ClipperHostCheck_artefacts\Release\ClipperHostCheck.exe "C:\Program Files\Common Files\VST3\Clipline.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # Validate the build-folder copy (it has the PDB next to it, so a crash report is symbolised).
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate build\Clipline_artefacts\Release\VST3\Clipline.vst3
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "pluginval exit code $code"
            $crash = Join-Path $env:TEMP "pluginval_crash.txt"
            if (Test-Path $crash) { Write-Host "---- pluginval crash report ----"; Get-Content $crash }
            Get-ChildItem pluginval-logs -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
            exit 1
          }
      - name: Export the installer into the log (base64, for retrieval without artifact storage)
        if: always()
        shell: bash
        run: |
          EXE=$(ls build/Installer/Windows/Release/*-Setup.exe)
          ls -l "$EXE"; sha256sum "$EXE"
          echo "-----BEGIN CLIPLINE EXE $(basename "$EXE")-----"
          base64 -w 4000 "$EXE"
          echo "-----END CLIPLINE EXE-----"
      - uses: actions/upload-artifact@v4
        with:
          name: Clipline-Windows-x64
          path: |
            build/Clipline_artefacts/Release/VST3/
            build/Installer/Windows/Release/*-Setup.exe

  macos:
    runs-on: macos-14            # Apple Silicon runner; the build is universal (arm64 + x86_64)
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Universal binaries
        run: |
          lipo -info build/Clipline_artefacts/Release/VST3/Clipline.vst3/Contents/MacOS/Clipline
          lipo -info build/Clipline_artefacts/Release/AU/Clipline.component/Contents/MacOS/Clipline
      - name: Unit tests
        run: build/Tests/ClipperTests_artefacts/Release/ClipperTests
      - name: VST3 host check (build folder)
        run: build/Tests/ClipperHostCheck_artefacts/Release/ClipperHostCheck build/Clipline_artefacts/Release/VST3/Clipline.vst3
      - name: Build the installer
        run: Installer/macOS/build-pkg.sh build Release
      - name: Install the .pkg and check the installed plugins
        run: |
          sudo installer -pkg build/Clipline-*-macOS.pkg -target /
          ls -la /Library/Audio/Plug-Ins/VST3/Clipline.vst3/Contents/MacOS /Library/Audio/Plug-Ins/Components/Clipline.component/Contents/MacOS
          build/Tests/ClipperHostCheck_artefacts/Release/ClipperHostCheck /Library/Audio/Plug-Ins/VST3/Clipline.vst3
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Clp1 Clpl
      - name: pluginval (VST3 and AU)
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate /Library/Audio/Plug-Ins/VST3/Clipline.vst3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --validate /Library/Audio/Plug-Ins/Components/Clipline.component
      - name: Export the installer into the log (base64, for retrieval without artifact storage)
        run: |
          PKG=$(ls build/Clipline-*-macOS.pkg)
          ls -l "$PKG"; shasum -a 256 "$PKG"
          echo "-----BEGIN CLIPLINE PKG $(basename "$PKG")-----"
          base64 -i "$PKG" | fold -w 4000
          echo "-----END CLIPLINE PKG-----"
      - uses: actions/upload-artifact@v4
        with:
          name: Clipline-macOS
          path: build/Clipline-*-macOS.pkg

  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build xvfb libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libasound2-dev libgl1-mesa-dev
      - name: Build
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ClipperTests
      - name: Tests
        run: xvfb-run -a build/Tests/ClipperTests_artefacts/Release/ClipperTests
